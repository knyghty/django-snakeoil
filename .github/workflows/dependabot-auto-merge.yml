name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --squash --auto "$PR_URL" ||
            gh pr merge --squash "$PR_URL" ||
            echo "::warning::Could not enable auto-merge or merge directly"
      # Action bumps are usually majors and CI exercises them directly, so
      # approve every update type there; elsewhere majors wait for review.
      - name: Approve
        if: >-
          contains(fromJSON('["github_actions", "github-actions"]'), steps.metadata.outputs.package-ecosystem)
          || steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"
